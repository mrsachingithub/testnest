<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestNest - New Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 bg-gradient">
    <div class="glass-card p-4 rounded-3 shadow-lg" style="width: 400px;">
        <h2 class="text-center mb-4" style="color: var(--color-accent);">Set New Password</h2>
        <form id="resetPasswordForm">
            <div class="mb-3">
                <label for="token" class="form-label">Reset Token</label>
                <input type="text" class="form-control" id="token" required />
            </div>
            <div class="mb-3">
                <label for="newPassword" class="form-label">New Password</label>
                <input type="password" class="form-control" id="newPassword" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3"
                style="background: var(--color-accent); border: none;">Update Password</button>
        </form>
        <div class="text-center">
            <a href="/" class="text-light text-decoration-none">Back to Login</a>
        </div>
        <div id="msg" class="mt-3 text-center"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
