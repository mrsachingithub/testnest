<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestNest - Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 bg-gradient">
    <div class="glass-card p-5 rounded-4 shadow-lg" style="width: 450px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-accent">Join TestNest</h2>
            <p class="text-secondary-custom">Create your account to get started</p>
        </div>
        <form id="signupForm">
            <div class="mb-3">
                <label for="name" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="name" placeholder="John Doe" required />
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email Address</label>
                <input type="email" class="form-control" id="email" placeholder="name@example.com" required />
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="••••••••" required />
            </div>
            <div class="mb-4">
                <label for="role" class="form-label">I am a...</label>
                <select class="form-select" id="role">
                    <option value="student">Student</option>
                    <option value="examiner">Examiner</option>
                </select>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 fs-5">Sign Up</button>
        </form>
        <div class="mt-4 text-center">
            <span class="text-light text-opacity-75">Already have an account? </span>
            <a href="/" class="text-accent text-decoration-none fw-bold">Login</a>
        </div>
        <div id="msg" class="mt-3 text-center"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
