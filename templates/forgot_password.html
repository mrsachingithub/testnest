<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestNest - Forgot Password</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="/static/css/style.css" rel="stylesheet" />
</head>

<body class="d-flex align-items-center justify-content-center min-vh-100 bg-gradient">
    <div class="glass-card p-4 rounded-3 shadow-lg" style="width: 400px;">
        <h2 class="text-center mb-4" style="color: var(--color-accent);">Reset Password</h2>
        <form id="forgotPasswordForm">
            <div class="mb-3">
                <label for="email" class="form-label">Enter your email</label>
                <input type="email" class="form-control" id="email" required />
            </div>
            <button type="submit" class="btn btn-primary w-100 mb-3"
                style="background: var(--color-accent); border: none;">Send Reset Link</button>
        </form>
        <div class="text-center">
            <a href="/" class="text-light text-decoration-none">Back to Login</a>
        </div>
        <div id="msg" class="mt-3 text-center"></div>
        <div id="tokenDisplay" class="mt-3 text-warning text-break" style="display:none;"></div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
