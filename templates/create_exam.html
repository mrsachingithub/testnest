<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestNest - Create Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet" />
</head>

<body class="bg-gradient d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TestNest</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="glass-card mb-4">
                    <h2 class="mb-4 text-accent">Create New Exam</h2>
                    <form id="createExamForm">
                        <div class="mb-3">
                            <label class="form-label" for="examTitle">Exam Title</label>
                            <input type="text" class="form-control" id="examTitle"
                                placeholder="e.g. Advanced Python Certification" required />
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="examDescription">Description</label>
                            <textarea class="form-control" id="examDescription" rows="3"
                                placeholder="Brief description of the exam..."></textarea>
                        </div>
                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label" for="examDuration">Duration (minutes)</label>
                                <input type="number" class="form-control" id="examDuration" min="1" placeholder="60"
                                    required />
                            </div>
                            <div class="col-md-6">
                                <label class="form-label" for="totalMarks">Total Marks</label>
                                <input type="number" class="form-control" id="totalMarks" min="1" value="100"
                                    required />
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Create & Proceed to Questions</button>
                    </form>
                </div>

                <div id="questionSection" style="display:none;">
                    <div class="glass-card">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <h3 class="text-accent">Add Questions</h3>
                            <button id="finalizeExamBtn" class="btn btn-primary">Finalize Exam</button>
                        </div>

                        <form id="addQuestionForm" class="mb-4 p-3 border border-secondary rounded">
                            <div class="mb-3">
                                <label class="form-label" for="questionText">Question Text</label>
                                <textarea class="form-control" id="questionText" rows="2"
                                    placeholder="Type your question here..." required></textarea>
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="questionTopic">Topic</label>
                                <input type="text" class="form-control" id="questionTopic"
                                    placeholder="e.g. History, Math, DevOps">
                            </div>
                            <div class="mb-3">
                                <label class="form-label" for="questionType">Question Type</label>
                                <select class="form-select" id="questionType">
                                    <option value="mcq" selected>Multiple Choice</option>
                                    <option value="tf">True / False</option>
                                </select>
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Options</label>
                                <div id="optionsDynamicContainer" class="d-flex flex-column gap-2 mb-2">
                                    <!-- Dynamic options will appear here -->
                                </div>
                                <button type="button" class="btn btn-sm btn-outline-info" onclick="addOptionInput()">+
                                    Add Option</button>
                            </div>
                            <button type="submit" class="btn btn-secondary w-100">Add Question</button>
                        </form>

                        <h4 class="mb-3">Questions Added:</h4>
                        <div id="questionsList" class="mt-2"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
