<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TestNest - Exam Mode</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet" />
</head>

<body class="bg-gradient d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">TestNest</a>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <!-- Timer moved to navbar for better visibility -->
                    <li class="nav-item me-3 d-flex align-items-center">
                        <span class="text-secondary-custom me-2">Time Remaining:</span>
                        <div class="timer" id="timer">00:00</div>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container py-5 mt-5 flex-grow-1">
        <div class="glass-card mt-3">
            <div class="d-flex justify-content-between align-items-center mb-4 border-bottom border-light pb-3">
                <h3 id="examTitle" class="text-accent mb-0">Exam Title</h3>
                <span class="badge bg-warning text-dark">Proctoring Active</span>
            </div>

            <div id="examContainer">
                <div class="text-center py-5">
                    <div class="spinner-border text-accent" role="status">
                        <span class="visually-hidden">Loading...</span>
                    </div>
                    <p class="mt-3 text-secondary-custom">Loading Exam Questions...</p>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    <script src="/static/js/app.js"></script>
</body>

</html>
